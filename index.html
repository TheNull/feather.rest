---
layout: layout.html
---
{% if collections.drafts.size > 0 %}
<h1>Drafts</h1>
{% for post in collections.drafts %}
    <h2><a href="{{ post.url }}">{{ post.data.title }}</a></h2>
    <p>{{ post.data.date }}</p>
    <p>{{ post.data.description }}</p>
{% endfor %}
{% endif %}
<h1>Blog Posts</h1>
{% for post in collections.blog %}
    <h2><a href="{{ post.url }}">{{ post.data.title }}</a></h2>
{% endfor %}
